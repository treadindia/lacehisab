<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#18212f;--muted:#667085;--line:#e5e7eb;--primary:#315efb;--primary2:#2449c7;--danger:#d92d20;--ok:#039855;--nav:#111827}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:flex;min-height:100vh}.side{width:240px;background:var(--nav);color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0}.brand{font-size:21px;font-weight:800;padding:10px 12px 24px}.brand small{display:block;color:#9ca3af;font-size:11px;margin-top:4px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#d1d5db;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer;font-size:14px}.nav button.active,.nav button:hover{background:#263247;color:#fff}.main{margin-left:240px;width:calc(100% - 240px);padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:25px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 1px 2px #00000008}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:25px;font-weight:800;margin-top:8px}.stat .sub{font-size:12px;color:var(--muted);margin-top:5px}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:150px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d7dce5;border-radius:8px;background:#fff;font:inherit;font-size:14px}textarea{min-height:75px}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.ghost{background:#eef2f7;color:#344054}.danger{background:#fee4e2;color:#b42318}.success{background:#d1fadf;color:#027a48}.section{margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h2{font-size:17px;margin:0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#fafafa}.pill{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef2ff;color:#3730a3}.pill.ok{background:#ecfdf3;color:#027a48}.pill.bad{background:#fef3f2;color:#b42318}.hidden{display:none!important}.sku-dropdown.hidden{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}.tabs button.active{background:#eef2ff;border-color:#bfcaff;color:#2449c7;font-weight:700}.bill-lines{width:100%;border-collapse:collapse}.bill-lines th,.bill-lines td{border-bottom:1px solid var(--line);padding:7px}.bill-lines input,.bill-lines select{padding:8px}.totalbox{max-width:420px;margin-left:auto}.totalrow{display:flex;justify-content:space-between;padding:7px 0}.totalrow.grand{font-size:19px;font-weight:800;border-top:2px solid var(--ink);margin-top:5px;padding-top:12px}.notice{padding:11px;border-radius:9px;background:#fffaeb;color:#92400e;font-size:13px;margin-bottom:12px}.canvasbox{height:300px}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:900px){.side{width:70px}.brand span,.brand small,.nav button span{display:none}.main{margin-left:70px;width:calc(100% - 70px)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.main{padding:12px}.grid{grid-template-columns:1fr}.row .field{min-width:100%}.side{width:58px}.main{margin-left:58px;width:calc(100% - 58px)}}
@media print{.side,.top,.no-print{display:none!important}.main{margin:0;width:100%;padding:0}.card{box-shadow:none;border:0}}

.dashboard-boxes{grid-template-columns:1fr 1fr}
.dashboard-boxes .card{min-width:0}
.dash-scroll{max-height:245px;overflow:auto;border:1px solid #e5e7eb;border-radius:8px}
.table.compact{margin:0}
.table.compact th,.table.compact td{padding:8px 10px;white-space:nowrap}
.pl-value{font-size:30px;font-weight:800;margin:8px 0 14px}
.pl-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pl-breakdown div{border-top:1px solid #eee;padding-top:8px;display:flex;flex-direction:column;gap:3px}
@media(max-width:900px){.dashboard-boxes{grid-template-columns:1fr}.pl-breakdown{grid-template-columns:1fr}}


.purchase-menu-wrap{position:relative;display:inline-block}.dots-btn{font-size:20px;line-height:1;padding:5px 9px}.purchase-menu{position:absolute;right:0;top:38px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px #0002;min-width:120px;padding:5px}.purchase-menu button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:9px 11px;border-radius:6px;cursor:pointer;font:inherit}.purchase-menu button:hover{background:#f2f4f7}.purchase-menu .menu-danger{color:#b42318}.purchase-menu.hidden{display:none!important}.sku-dropdown.hidden{display:none!important}
</style>

<style>
:root{color-scheme:light}
html,body{max-width:100%;overflow-x:hidden}
#navToggle,#lhOut2{display:none}
@media(max-width:760px){
 .app{display:block}
 .side{width:265px!important;transform:translateX(-105%);transition:transform .2s ease;z-index:1000;overflow-y:auto;padding-bottom:30px}
 body.navopen .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
 .brand span,.nav button span{display:inline!important}
 .brand small{display:block!important}
 .nav button{padding:13px 12px;font-size:15px}
 .main{margin-left:0!important;width:100%!important;padding:10px!important;min-width:0}
 .top{position:sticky;top:0;z-index:50;background:var(--bg);padding:8px 0;margin-bottom:10px;gap:8px;flex-wrap:nowrap;align-items:center}
 .top>div{flex:1;min-width:0}
 .top h1{font-size:19px;line-height:1.2}
 .top .btn{white-space:nowrap;padding:9px 11px;font-size:13px}
 #navToggle{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:9px;width:40px;height:40px;font-size:20px;flex:none;cursor:pointer}
 #lhOut{display:none!important}
 #lhOut2{display:block;width:100%;margin-top:10px;background:#374151;color:#fff}
 .grid{grid-template-columns:1fr 1fr!important;gap:10px}
 .dashboard-boxes,[style*="grid-template-columns"]{grid-template-columns:1fr!important}
 .stat .value{font-size:19px}
 .card{padding:13px;min-width:0;max-width:100%}
 .row{gap:8px}
 .row .field,.field{min-width:100%!important;flex:1 1 100%}
 input,select,textarea{font-size:16px}
 .btn{padding:10px 12px}
 .section-head{flex-wrap:wrap;gap:8px}
 .tabs button{flex:1 1 auto}
 .table,.bill-lines{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
 .bill-lines,.bill-lines tbody{display:block;overflow:visible}
 .bill-lines thead{display:none}
 .bill-lines tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fff}
 .bill-lines td{border:0!important;padding:0!important;display:block;min-width:0}
 .bill-lines td:nth-child(1){grid-column:1/-1}
 .bill-lines td:nth-child(6){grid-column:1/-1}
 .bill-lines td:nth-child(n+2):nth-child(-n+5)::before{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
 .bill-lines td:nth-child(2)::before{content:'Qty (pcs)'}
 .bill-lines td:nth-child(3)::before{content:'Rate'}
 .bill-lines td:nth-child(4)::before{content:'Discount'}
 .bill-lines td:nth-child(5)::before{content:'Amount'}
 .bill-lines .bl-search{min-width:0!important}
 .tablewrap,.dash-scroll{max-width:100%;overflow-x:auto}
 canvas,img,svg{max-width:100%}
 .canvasbox{max-width:100%;overflow-x:auto}
 .totalbox{max-width:100%}
 .pl-value{font-size:24px}
 .purchase-menu{right:0;max-width:92vw}
}
</style>

<body>
<div class="app">
<aside class="side">
  <div class="brand">LaceHisab <span>🧾</span><small>for Lace Business</small></div>
  <div class="nav" id="nav"></div><div style="border-top:1px solid #344054;margin:12px 6px;padding-top:12px"><button class="btn" style="width:100%;background:#5b3cc4;color:#fff" onclick="showMill()">🏭 Mill Section</button></div>
</aside>
<main class="main">
  <div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="muted" id="dateNow"></div></div><button class="btn primary" onclick="showPage('billing')">＋ New Bill</button></div>
  <div id="content"></div>
</main>
</div>

<script>
const KEY='lacehisab_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 settings:{business:'Tread India',address:'',phone:'',gstin:'',invoicePrefix:'INV'},
 products:[], customers:[], suppliers:[], purchases:[], sales:[], bills:[], expenses:[], payments:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(db));try{syncPush('main')}catch(e){}}
function saleQtyForProduct(p){return db.sales.filter(s=>String(s.sku||'').toLowerCase()===String(p.sku||'').toLowerCase()&&String(s.color||'').toLowerCase()===String(p.color||'').toLowerCase()).reduce((a,s)=>a+(Number(s.qty)||0),0)}
function purchaseQtyForProduct(p,excludePurchaseId=''){return db.purchases.filter(x=>x.id!==excludePurchaseId&&String(x.sku||'').toLowerCase()===String(p.sku||'').toLowerCase()&&String(x.color||'').toLowerCase()===String(p.color||'').toLowerCase()).reduce((a,x)=>a+(Number(x.qty)||0),0)}
function inventoryPurchaseQty(p){return purchaseQtyForProduct(p)}
function inventorySalesQty(p){return saleQtyForProduct(p)}
function ensureStockBaselines(){
 db.products.forEach(p=>{
   if(!Number.isFinite(Number(p.openingStock))){
     p.openingStock=Number(p.stock||0)+saleQtyForProduct(p)-purchaseQtyForProduct(p);
   }
 });
}
function recalculateStock(){
 ensureStockBaselines();
 db.products.forEach(p=>{p.stock=Number(p.openingStock||0)+purchaseQtyForProduct(p)-saleQtyForProduct(p);});
}
function salesAmountTotal(){
 const billed=db.bills.reduce((a,b)=>a+(Number(b.total)||0),0);
 const billedNos=new Set(db.bills.map(b=>b.no));
 const orphan=db.sales.filter(s=>!s.billNo||!billedNos.has(s.billNo)).reduce((a,s)=>a+(Number(s.total)||0),0);
 return billed+orphan;
}
function monthlySalesAmount(key){
 const billed=db.bills.filter(b=>String(b.date||'').startsWith(key)).reduce((a,b)=>a+(Number(b.total)||0),0);
 const billedNos=new Set(db.bills.filter(b=>String(b.date||'').startsWith(key)).map(b=>b.no));
 const orphan=db.sales.filter(s=>String(s.date||'').startsWith(key)&&(!s.billNo||!db.bills.some(b=>b.no===s.billNo))).reduce((a,s)=>a+(Number(s.total)||0),0);
 return billed+orphan;
}
function stockAvailableAfterRemovingBill(p,billNo){
 let sold= db.sales.filter(s=>s.billNo!==billNo && String(s.sku||'').toLowerCase()===String(p.sku||'').toLowerCase() && String(s.color||'').toLowerCase()===String(p.color||'').toLowerCase()).reduce((a,s)=>a+(Number(s.qty)||0),0);
 return Number(p.openingStock||0)+purchaseQtyForProduct(p)-sold;
}
ensureStockBaselines();
recalculateStock();
const pages=[
 ['dashboard','▦','Dashboard'],['billing','🧾','Create Bill'],['bills','📋','Bills'],['sales','↗','Sales'],['payments','₹','Payments'],['ledger','▤','Ledger'],['purchases','↙','Purchases'],['inventory','▤','Inventory'],['customers','👥','Customers'],['suppliers','🏭','Suppliers'],['expenses','₹','Expenses'],['reports','▥','Reports'],['excel','⇅','Excel Import'],['settings','⚙','Settings']
];
function money(n){let v=Math.round(Number(n)||0);return (v<0?'-':'')+'₹'+Math.abs(v).toLocaleString('en-IN');}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function normalizeBillNo(value){return String(value??'').trim().toUpperCase()}
function validateBillNo(value,excludeBillId=''){
 const no=normalizeBillNo(value);
 if(!no)return 'Bill number is required.';
 if(no.length>30)return 'Bill number must be 30 characters or fewer.';
 if(!/^[A-Z0-9\/-]+$/.test(no))return 'Use only letters, numbers, hyphens (-), or slashes (/). Spaces and special characters are not allowed.';
 if(db.bills.some(b=>b.id!==excludeBillId&&normalizeBillNo(b.no)===no))return 'This bill number already exists. Please use a different number.';
 const currentBill=excludeBillId?db.bills.find(b=>b.id===excludeBillId):null;
 const allowedCurrentNo=currentBill?normalizeBillNo(currentBill.no):'';
 const orphanConflict=db.sales.some(s=>normalizeBillNo(s.billNo)===no&&normalizeBillNo(s.billNo)!==allowedCurrentNo&&!db.bills.some(b=>normalizeBillNo(b.no)===normalizeBillNo(s.billNo)));
 if(orphanConflict)return 'This bill number is already used in Sales records not linked to a bill. Please use a different number.';
 return '';
}
function nextBillNo(){
 const prefix=normalizeBillNo(db.settings.invoicePrefix||'INV');
 const escapedPrefix=prefix.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const pattern=new RegExp('^'+escapedPrefix+'[-/]?(\\d+)$','i');
 let max=0;
 [...db.bills.map(b=>b.no),...db.sales.map(s=>s.billNo)].forEach(value=>{const m=String(value||'').trim().match(pattern);if(m)max=Math.max(max,Number(m[1])||0)});
 return prefix+'-'+String(max+1).padStart(5,'0');
}
function nav(){document.getElementById('nav').innerHTML=pages.map(p=>`<button class="${current===p[0]?'active':''}" onclick="showPage('${p[0]}')">${p[1]} <span>${p[2]}</span></button>`).join('')}
let current='dashboard';
function showPage(p){current=p;nav();document.getElementById('pageTitle').textContent=pages.find(x=>x[0]===p)[2];render()}
function render(){document.getElementById('dateNow').textContent=new Date().toLocaleString('en-IN');let c=document.getElementById('content');({dashboard:dashboard,billing:billing,bills:bills,sales:sales,payments:payments,ledger:ledger,purchases:purchases,inventory:inventory,customers:customers,suppliers:suppliers,expenses:expenses,reports:reports,excel:excel,settings:settings}[current])()}
function dashboard(){
 recalculateStock();
 let sales=salesAmountTotal();
 let pur=db.purchases.reduce((a,x)=>a+(Number(x.total)||0),0);
 let due=db.customers.reduce((a,c)=>a+partyDue(c.id),0);
 let stock=db.products.reduce((a,x)=>a+Number(x.stock||0)*Number(x.cost||0),0);
 let exp=db.expenses.reduce((a,x)=>a+(Number(x.amount)||0),0);
 let profit=sales-pur-exp;

 let inv=[...db.products].sort((a,b)=>
   String(a.sku||'').localeCompare(String(b.sku||'')) ||
   String(a.color||'').localeCompare(String(b.color||''))
 );

 let partyMap={};
 db.customers.forEach(c=>partyMap[c.id]={name:c.name||'Cash / Walk-in',phone:c.phone||'',due:0});
 db.customers.forEach(c=>{
   partyMap[c.id]={name:c.name||'Cash / Walk-in',phone:c.phone||'',due:partyDue(c.id)};
 });
 // Include any unmatched/customer-less sales as cash/walk-in, but party outstanding is driven by bills minus separate payments.
 const cashDue=db.bills.filter(b=>!b.customerId).reduce((a,b)=>a+(Number(b.total)||0),0);
 if(Math.abs(cashDue)>0.004)partyMap['cash']={name:'Cash / Walk-in',phone:'',due:cashDue};
 let parties=Object.values(partyMap).filter(x=>Math.abs(x.due)>0.004).sort((a,b)=>b.due-a.due);

 document.getElementById('content').innerHTML=`<div class="grid">
 <div class="card stat"><div class="label">Total Sales</div><div class="value">${money(sales)}</div><div class="sub">${db.sales.length} sales entries</div></div>
 <div class="card stat"><div class="label">Purchase</div><div class="value">${money(pur)}</div><div class="sub">${db.purchases.length} purchase entries</div></div>
 <div class="card stat"><div class="label">Customer Due</div><div class="value">${money(due)}</div><div class="sub">${parties.length} parties outstanding</div></div>
 <div class="card stat"><div class="label">Stock Value</div><div class="value">${money(stock)}</div><div class="sub">${db.products.length} SKU/color items</div></div>
 </div>

 <div class="section grid dashboard-boxes">
   <div class="card">
     <div class="section-head"><h2>Profit / Loss</h2><span class="status ${profit>=0?'paid':'due'}">${profit>=0?'Profit':'Loss'}</span></div>
     <div class="pl-value">${money(profit)}</div>
     <div class="pl-breakdown">
       <div><span>Sales</span><b>${money(sales)}</b></div>
       <div><span>Purchases</span><b>${money(pur)}</b></div>
       <div><span>Expenses</span><b>${money(exp)}</b></div>
     </div>
   </div>

   <div class="card">
     <div class="section-head"><h2>Inventory</h2><span class="sub">${inv.length} entries</span></div>
     <div class="dash-scroll">
       <table class="table compact"><thead><tr><th>SKU</th><th>Color</th><th>Stock</th><th>Rate</th></tr></thead>
       <tbody>${inv.length?inv.map(p=>`<tr><td>${esc(p.sku||'')}</td><td>${esc(p.color||'')}</td><td>${Number(p.stock)||0}</td><td>${money(p.sell||0)}</td></tr>`).join(''):`<tr><td colspan="4" class="muted">No inventory</td></tr>`}</tbody></table>
     </div>
   </div>

   <div class="card">
     <div class="section-head"><h2>Party-wise Outstanding</h2><span class="sub">${parties.length} parties</span></div>
     <div class="dash-scroll">
       <table class="table compact"><thead><tr><th>Party</th><th>Phone</th><th>Outstanding</th></tr></thead>
       <tbody>${parties.length?parties.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.phone)}</td><td><b>${money(p.due)}</b></td></tr>`).join(''):`<tr><td colspan="3" class="muted">No outstanding amount</td></tr>`}</tbody></table>
     </div>
   </div>
 </div>

 <div class="section grid" style="grid-template-columns:2fr 1fr">
 <div class="card"><div class="section-head"><h2>Monthly Sales</h2></div><div class="canvasbox"><canvas id="salesChart"></canvas></div></div>
 <div class="card"><div class="section-head"><h2>Quick Actions</h2></div><div class="row"><button class="btn primary" onclick="showPage('billing')">Create Bill</button><button class="btn ghost" onclick="showPage('purchases')">Add Purchase</button><button class="btn ghost" onclick="showPage('inventory')">Add SKU/Color</button></div></div>
 </div>`;
 drawChart();
}
function drawChart(){
 let cv=document.getElementById('salesChart');if(!cv)return;
 let ctx=cv.getContext('2d'),w=cv.clientWidth,h=cv.clientHeight,dpr=devicePixelRatio||1;
 cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 let arr=Array(6).fill(0), labels=[], keys=[];
 for(let i=5;i>=0;i--){let d=new Date();d.setMonth(d.getMonth()-i);let label=d.toLocaleString('en',{month:'short'});labels.push(label);let k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');keys.push(k);arr[5-i]=monthlySalesAmount(k)}
 let max=Math.max(...arr,1);ctx.font='12px Arial';ctx.strokeStyle='#e5e7eb';ctx.fillStyle='#667085';
 for(let j=0;j<4;j++){let y=25+j*(h-55)/3;ctx.beginPath();ctx.moveTo(35,y);ctx.lineTo(w-10,y);ctx.stroke()}
 let gap=(w-60)/arr.length, bw=gap*.62;
 arr.forEach((v,i)=>{let x=45+i*gap,y=h-30-(v/max)*(h-65);ctx.fillStyle='#315efb';ctx.fillRect(x,y,bw,h-30-y);ctx.fillStyle='#667085';ctx.fillText(labels[i],x,h-10);});
 cv._chartData={arr,labels,keys,xStart:45,gap,bw,w,h};
 cv.onmousemove=function(e){let d=cv._chartData;if(!d)return;let r=cv.getBoundingClientRect(),mx=e.clientX-r.left,i=Math.floor((mx-d.xStart)/d.gap);if(i>=0&&i<d.arr.length&&mx>=d.xStart&&mx<=d.xStart+d.gap*d.arr.length){let tip=document.getElementById('salesChartTip');if(!tip){tip=document.createElement('div');tip.id='salesChartTip';tip.style.cssText='position:fixed;z-index:9999;background:#111827;color:#fff;padding:8px 11px;border-radius:7px;font:12px Arial;pointer-events:none;box-shadow:0 4px 12px #0003;white-space:nowrap';document.body.appendChild(tip)}tip.textContent=d.labels[i]+' '+d.keys[i]+' — Sales: '+money(d.arr[i]);tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';tip.style.display='block';}else{let tip=document.getElementById('salesChartTip');if(tip)tip.style.display='none';}};
 cv.onmouseleave=function(){let tip=document.getElementById('salesChartTip');if(tip)tip.style.display='none';};
}
function formatDateDMY(value){const v=String(value||'');if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}return v}
function productOptions(){return db.products.map(p=>`<option value="${p.id}">${esc(p.sku)} — ${esc(p.color||'') } (stock ${p.stock||0})</option>`).join('')}

 let list=db.products.map(p=>{const sku=String(p.sku||'').toLowerCase(),color=String(p.color||'').toLowerCase(),combined=sku+' '+color;let rank=!q?4:sku===q?0:sku.startsWith(q)?1:combined.includes(q)?2:3;return {p,rank,available:Math.max(0,billBaseStock(p)-(otherQty[p.id]||0))}}).filter(x=>!q||x.rank<3).sort((a,b)=>a.rank-b.rank||String(a.p.sku||'').localeCompare(String(b.p.sku||''),undefined,{numeric:true})||String(a.p.color||'').localeCompare(String(b.p.color||'')));

 // Place the dropdown in the viewport, outside the scrollable bill table.
 const rect=input.getBoundingClientRect(),gap=4,desired=Math.min(300,Math.max(120,menu.scrollHeight||240)),below=window.innerHeight-rect.bottom-gap,above=rect.top-gap;
 const openBelow=below>=Math.min(desired,160)||below>=above;
 const maxH=Math.max(90,Math.min(desired,openBelow?below:above));
 menu.style.position='fixed';menu.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-rect.width-8))+'px';menu.style.width=Math.min(rect.width,window.innerWidth-16)+'px';menu.style.right='auto';menu.style.top=openBelow?(rect.bottom+gap)+'px':'auto';menu.style.bottom=openBelow?'auto':(window.innerHeight-rect.top+gap)+'px';menu.style.maxHeight=maxH+'px';menu.style.overflowY='auto';menu.style.zIndex='99999';
 menu.classList.remove('hidden');
}

function importBillItemsExcel(){
 const input=document.getElementById('billItemsExcel'),out=document.getElementById('billExcelResult');
 if(!input||!input.files||!input.files[0])return alert('Please select a Bill Items Excel file first.');
 if(typeof XLSX==='undefined')return alert('Excel library is not loaded. Check your internet connection and try again.');
 const reader=new FileReader();reader.onload=function(e){
  let wb;try{wb=XLSX.read(e.target.result,{type:'array',cellDates:true})}catch(err){out.innerHTML='<div class="notice">Could not read this Excel file. Please use the bill items template.</div>';return}
  const sheet=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false});
  if(!rows.length){out.innerHTML='<div class="notice">The Excel file has no item rows.</div>';return}
  const norm=x=>String(x||'').trim().toLowerCase().replace(/[ _-]+/g,'');
  const errors=[],items=[];
  rows.forEach((row,i)=>{
   const vals={};Object.keys(row).forEach(k=>vals[norm(k)]=row[k]);
   const sku=String(vals.sku||vals.design||'').trim(),color=String(vals.color||'').trim(),qty=Number(vals.qty||vals.quantity||0),rate=Number(vals.rate||vals.price||0),discount=Number(vals.discount||0);
   if(!sku&&!color&&!qty&&!rate)return;
   const p=db.products.find(x=>String(x.sku||'').trim().toLowerCase()===sku.toLowerCase()&&String(x.color||'').trim().toLowerCase()===color.toLowerCase());
   if(!sku||!color)errors.push(`Row ${i+2}: SKU and Color are required.`);
   else if(!p)errors.push(`Row ${i+2}: SKU/Color not found in Inventory: ${sku} / ${color}.`);
   if(!Number.isFinite(qty)||qty<=0)errors.push(`Row ${i+2}: Qty must be greater than zero.`);
   if(!Number.isFinite(rate)||rate<0)errors.push(`Row ${i+2}: Rate must be zero or greater.`);
   if(!Number.isFinite(discount)||discount<0)errors.push(`Row ${i+2}: Discount must be zero or greater.`);
   if(p&&sku&&color&&Number.isFinite(qty)&&qty>0&&Number.isFinite(rate)&&rate>=0&&Number.isFinite(discount)&&discount>=0)items.push({p,qty,rate,discount});
  });
  // Validate available inventory for the entire import before adding any rows.
  // Aggregate duplicate SKU/color lines so splitting a quantity across rows cannot bypass the stock check.
  const requestedByProduct=new Map();
  items.forEach(x=>{const key=String(x.p.id);requestedByProduct.set(key,(requestedByProduct.get(key)||0)+x.qty)});
  const currentByProduct=new Map();
  document.querySelectorAll('#billLines tr').forEach(tr=>{
   const pid=tr.querySelector('.bl-prod')?.value, q=Number(tr.querySelector('.bl-qty')?.value)||0;
   if(pid&&q>0)currentByProduct.set(pid,(currentByProduct.get(pid)||0)+q);
  });
  requestedByProduct.forEach((qty,pid)=>{
   const p=db.products.find(x=>String(x.id)===pid); if(!p)return;
   const currentQty=currentByProduct.get(pid)||0;
   let available=Number(p.stock)||0;
   if(editingBillId){const editingBill=db.bills.find(b=>b.id===editingBillId);if(editingBill)available=stockAvailableAfterRemovingBill(p,editingBill.no)}
   if(currentQty+qty>available)errors.push(`Insufficient inventory for SKU ${p.sku} / Color ${p.color||''}: available ${available} pcs, already in bill ${currentQty} pcs, Excel requests ${qty} pcs, total needed ${currentQty+qty} pcs.`);
  });
  if(errors.length){out.innerHTML='<div class="card" style="border-color:#fda29b"><b style="color:#b42318">Import stopped — fix these errors first:</b>'+errors.map(x=>`<div style="padding:4px 0">${esc(x)}</div>`).join('')+'<p class="muted">No bill items were added. Inventory was not changed.</p></div>';return}
  if(!items.length){out.innerHTML='<div class="notice">No valid item rows found.</div>';return}
  if(!confirm(`Import ${items.length} item row(s) into this bill? Inventory availability has been checked.`))return;
  items.forEach(x=>{addBillLine();const tr=document.querySelector('#billLines tr:last-child');tr.querySelector('.bl-prod').value=x.p.id;tr.querySelector('.bl-qty').value=x.qty;tr.querySelector('.bl-rate').value=x.rate;tr.querySelector('.bl-disc').value=x.discount;});
  calcBill();out.innerHTML=`<div class="notice" style="background:#ecfdf3;color:#027a48">Successfully imported ${items.length} item row(s). Please review the bill before saving.</div>`;input.value='';
 };reader.readAsArrayBuffer(input.files[0]);
}

function importPurchaseExcel(){
 const file=document.getElementById('purchaseExcelFile')?.files?.[0],out=document.getElementById('purchaseExcelResult');
 if(!file){out.innerHTML='<div class="notice">Please select a purchase Excel file first.</div>';return}
 if(typeof XLSX==='undefined'){out.innerHTML='<div class="notice">Excel library is not loaded. Check your internet connection.</div>';return}
 const reader=new FileReader();reader.onload=e=>{
  let wb;try{wb=XLSX.read(e.target.result,{type:'array',cellDates:true})}catch(err){out.innerHTML='<div class="notice">Could not read this Excel file. Please use the purchase template.</div>';return}
  if(!wb.SheetNames.includes('Purchases')){out.innerHTML='<div class="notice">Missing sheet "Purchases". Download and use the predefined Purchase Excel Template.</div>';return}
  const rows=sheetRows(wb,'Purchases')||[],expected=['Date','Supplier Name','SKU','Color','Qty (pcs)','Rate','GST %','Paid'],head=(rows[0]||[]).map(norm),errs=[],items=[];
  expected.forEach((h,i)=>{if(head[i]!==h)errs.push(`Purchases: Column ${i+1} must be "${h}" (found "${head[i]||''}")`)});
  if(!errs.length){for(let i=1;i<rows.length;i++){
   const r=rows[i],row=i+1;if(!r.some(x=>norm(x)))continue;
   const date=dateVal(r[0],row,'Date',errs),supplierName=norm(r[1]),sku=norm(r[2]),color=norm(r[3]),qty=num(r[4],row,'Qty (pcs)',errs),rate=num(r[5],row,'Rate',errs),gst=num(r[6],row,'GST %',errs,true),paid=num(r[7],row,'Paid',errs,true);
   if(!date)errs.push(`Purchases row ${row}: Date is required`);if(!sku)errs.push(`Purchases row ${row}: SKU is required`);if(!color)errs.push(`Purchases row ${row}: Color is required`);if(qty<=0)errs.push(`Purchases row ${row}: Qty must be greater than zero`);if(rate<0)errs.push(`Purchases row ${row}: Rate cannot be negative`);if(gst<0)errs.push(`Purchases row ${row}: GST cannot be negative`);if(paid<0)errs.push(`Purchases row ${row}: Paid cannot be negative`);
   items.push({date,supplierName,sku,color,qty,rate,gst,paid,total:qty*rate*(1+gst/100)});
  }}
  if(errs.length){out.innerHTML=`<div class="card" style="border-color:#fda29b"><h3 style="color:#b42318">❌ Import stopped — ${errs.length} error(s)</h3><div style="max-height:300px;overflow:auto">${errs.slice(0,100).map(x=>`<div>${esc(x)}</div>`).join('')}</div><p class="muted">No data was changed. Correct the Excel file and upload again.</p></div>`;return}
  if(!items.length){out.innerHTML='<div class="notice">No purchase rows found in the file.</div>';return}
  if(!confirm(`Import ${items.length} purchase row(s)? This will increase inventory stock.`))return;
  items.forEach(x=>{
   let prod=db.products.find(p=>String(p.sku||'').toLowerCase()===x.sku.toLowerCase()&&String(p.color||'').toLowerCase()===x.color.toLowerCase());
   if(!prod){prod={id:id(),sku:x.sku,color:x.color,stock:0,openingStock:0,cost:x.rate,sell:x.rate};db.products.push(prod)}
   prod.cost=x.rate;
   let supplierId='';if(x.supplierName){let sup=db.suppliers.find(s=>String(s.name||'').toLowerCase()===x.supplierName.toLowerCase());if(!sup){sup={id:id(),name:x.supplierName,phone:'',gstin:'',address:''};db.suppliers.push(sup)}supplierId=sup.id}
   db.purchases.push({id:id(),date:x.date,supplierId,sku:x.sku,color:x.color,qty:x.qty,rate:x.rate,gst:x.gst,paid:x.paid,total:x.total});
  });
  recalculateStock();save();out.innerHTML=`<div class="card" style="border-color:#6ce9a6"><h3 style="color:#027a48">✅ Purchase import successful</h3><p>Imported ${items.length} purchase row(s). Inventory stock has been recalculated.</p></div>`;document.getElementById('purchaseExcelFile').value='';render();
 };reader.readAsArrayBuffer(file);
}

function norm(v){return String(v??'').trim()}
function num(v, row, col, errs, allowBlank=false){
 if((v===''||v===null||v===undefined) && allowBlank)return 0;
 let n=Number(v);if(!Number.isFinite(n))errs.push(`Row ${row}: ${col} must be a number (found "${norm(v)}")`);
 return Number.isFinite(n)?n:0;
}
function dateVal(v,row,col,errs){
 if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
 let s=norm(v);if(!s)return '';
 let d=new Date(s);if(isNaN(d)){errs.push(`Row ${row}: ${col} has invalid date "${s}"`);return ''}
 return d.toISOString().slice(0,10);
}
function sheetRows(wb,name){
 const ws=wb.Sheets[name]; if(!ws)return null;
 return XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
}
function importExcel(){
 const file=document.getElementById('excelFile')?.files?.[0], out=document.getElementById('excelResult');
 if(!file){out.innerHTML='<div class="notice">Please select an Excel file first.</div>';return}
 const reader=new FileReader();
 reader.onload=e=>{
  let wb;try{wb=XLSX.read(e.target.result,{type:'array',cellDates:true})}catch(err){out.innerHTML=`<div class="notice">❌ Could not read this Excel file. Please use the downloaded template.</div>`;return}
  const required=["Products","Customers","Suppliers","Purchases","Sales","Expenses"];
  const missing=required.filter(s=>!wb.SheetNames.includes(s));
  if(missing.length){out.innerHTML=`<div class="notice">❌ Missing required sheet(s): ${missing.join(', ')}. Please use the predefined template.</div>`;return}
  const errs=[], parsed={products:[],customers:[],suppliers:[],purchases:[],sales:[],expenses:[]};
  const expected={
   Products:["SKU","Color","Opening Stock (pcs)","Cost Per Piece","Sale Rate Per Piece"],
   Customers:["Name","Phone","GSTIN","Address"], Suppliers:["Name","Phone","GSTIN","Address"],
   Purchases:["Date","Supplier Name","SKU","Color","Qty (pcs)","Rate","GST %","Paid"],
   Sales:["Date","Bill No","Customer Name","SKU","Color","Qty (pcs)","Rate","Discount","GST %","Transport","Paid"],
   Expenses:["Date","Category","Amount","Note"]
  };
  for(const [sn,headers] of Object.entries(expected)){
   const rows=sheetRows(wb,sn)||[];
   const head=(rows[0]||[]).map(norm);
   headers.forEach((h,i)=>{if(head[i]!==h)errs.push(`${sn}: Column ${i+1} must be "${h}" (found "${head[i]||''}")`)});
   if(errs.length>80)break;
  }
  if(!errs.length){
   // Customers / suppliers
   for(let i=1;i<(sheetRows(wb,"Customers")||[]).length;i++){let r=sheetRows(wb,"Customers")[i], row=i+1;if(!norm(r[0]))continue;parsed.customers.push({id:id(),name:norm(r[0]),phone:norm(r[1]),gstin:norm(r[2]),address:norm(r[3])})}
   for(let i=1;i<(sheetRows(wb,"Suppliers")||[]).length;i++){let r=sheetRows(wb,"Suppliers")[i], row=i+1;if(!norm(r[0]))continue;parsed.suppliers.push({id:id(),name:norm(r[0]),phone:norm(r[1]),gstin:norm(r[2]),address:norm(r[3])})}
   // Products
   for(let i=1;i<(sheetRows(wb,"Products")||[]).length;i++){let r=sheetRows(wb,"Products")[i],row=i+1;if(!norm(r[0])&&!norm(r[1]))continue;if(!norm(r[0]))errs.push(`Products row ${row}: SKU is required`);if(!norm(r[1]))errs.push(`Products row ${row}: Color is required`);parsed.products.push({id:id(),sku:norm(r[0]),color:norm(r[1]),stock:num(r[2],row,"Opening Stock (pcs)",errs),openingStock:num(r[2],row,"Opening Stock (pcs)",errs),cost:num(r[3],row,"Cost Per Piece",errs),sell:num(r[4],row,"Sale Rate Per Piece",errs)})}
   // Purchases
   for(let i=1;i<(sheetRows(wb,"Purchases")||[]).length;i++){let r=sheetRows(wb,"Purchases")[i],row=i+1;if(!r.some(x=>norm(x)))continue;let date=dateVal(r[0],row,"Date",errs),qty=num(r[4],row,"Qty (pcs)",errs),rate=num(r[5],row,"Rate",errs),gst=num(r[6],row,"GST %",errs),paid=num(r[7],row,"Paid",errs);if(!norm(r[2]))errs.push(`Purchases row ${row}: SKU is required`);if(!norm(r[3]))errs.push(`Purchases row ${row}: Color is required`);if(qty<0)errs.push(`Purchases row ${row}: Qty cannot be negative`);parsed.purchases.push({id:id(),date,supplierName:norm(r[1]),sku:norm(r[2]),color:norm(r[3]),qty,rate,gst,paid,total:qty*rate*(1+gst/100)})}
   // Sales
   for(let i=1;i<(sheetRows(wb,"Sales")||[]).length;i++){let r=sheetRows(wb,"Sales")[i],row=i+1;if(!r.some(x=>norm(x)))continue;let date=dateVal(r[0],row,"Date",errs),qty=num(r[5],row,"Qty (pcs)",errs),rate=num(r[6],row,"Rate",errs),disc=num(r[7],row,"Discount",errs),gst=num(r[8],row,"GST %",errs),transport=num(r[9],row,"Transport",errs),paid=num(r[10],row,"Paid",errs);if(!norm(r[2]))errs.push(`Sales row ${row}: Customer Name is required (use Cash for cash sales)`);if(!norm(r[3]))errs.push(`Sales row ${row}: SKU is required`);if(!norm(r[4]))errs.push(`Sales row ${row}: Color is required`);if(qty<0)errs.push(`Sales row ${row}: Qty cannot be negative`);let sub=Math.max(0,qty*rate-disc),total=sub*(1+gst/100)+transport;parsed.sales.push({id:id(),date,billNo:norm(r[1]),customerName:norm(r[2]),sku:norm(r[3]),color:norm(r[4]),qty,rate,discount:disc,gstRate:gst,transport,total,paid})}
   // Expenses
   for(let i=1;i<(sheetRows(wb,"Expenses")||[]).length;i++){let r=sheetRows(wb,"Expenses")[i],row=i+1;if(!r.some(x=>norm(x)))continue;let amount=num(r[2],row,"Amount",errs),date=dateVal(r[0],row,"Date",errs);if(amount<0)errs.push(`Expenses row ${row}: Amount cannot be negative`);parsed.expenses.push({id:id(),date,cat:norm(r[1]),amount,note:norm(r[3])})}
  }
  if(errs.length){
   out.innerHTML=`<div class="card" style="border-color:#fda29b"><h3 style="color:#b42318;margin-top:0">❌ Import stopped — ${errs.length} error(s)</h3><div style="max-height:360px;overflow:auto">${errs.slice(0,100).map(x=>`<div style="padding:5px 0;border-bottom:1px solid #fee4e2">${esc(x)}</div>`).join('')}</div><p class="muted">Fix the Excel file and upload it again. No data was changed.</p></div>`;
   return;
  }
  // Build into a temporary copy and validate cross references / stock.
  let tmp=JSON.parse(JSON.stringify(db));
  const findOrAdd=(arr,name)=>{let x=arr.find(a=>a.name.toLowerCase()===name.toLowerCase());if(x)return x;x={id:id(),name,phone:'',gstin:'',address:''};arr.push(x);return x};
  parsed.customers.forEach(x=>{if(!tmp.customers.some(y=>y.name.toLowerCase()===x.name.toLowerCase()))tmp.customers.push(x)});
  parsed.suppliers.forEach(x=>{if(!tmp.suppliers.some(y=>y.name.toLowerCase()===x.name.toLowerCase()))tmp.suppliers.push(x)});
  parsed.products.forEach(x=>{let p=tmp.products.find(y=>y.sku.toLowerCase()===x.sku.toLowerCase()&&y.color.toLowerCase()===x.color.toLowerCase());if(p){p.openingStock=Number(p.openingStock||0)+Number(x.openingStock||x.stock||0);p.cost=x.cost||p.cost;p.sell=x.sell||p.sell}else tmp.products.push(x)});
  parsed.purchases.forEach(x=>{let p=tmp.products.find(y=>y.sku.toLowerCase()===x.sku.toLowerCase()&&y.color.toLowerCase()===x.color.toLowerCase());if(!p)errs.push(`Purchases row for ${x.sku}/${x.color}: SKU/color not found in Products sheet`);else p.stock=Number(p.stock)+x.qty});
  parsed.sales.forEach(x=>{let p=tmp.products.find(y=>y.sku.toLowerCase()===x.sku.toLowerCase()&&y.color.toLowerCase()===x.color.toLowerCase());if(!p)errs.push(`Sales row for ${x.sku}/${x.color}: SKU/color not found in Products sheet`);else if(p.stock<x.qty)errs.push(`Sales row for ${x.sku}/${x.color}: insufficient stock after opening/purchases. Available ${p.stock}, sale ${x.qty}`);else p.stock-=x.qty});
  if(errs.length){out.innerHTML=`<div class="card" style="border-color:#fda29b"><h3 style="color:#b42318;margin-top:0">❌ Import stopped — stock/reference errors</h3>${errs.map(x=>`<div style="padding:5px 0;border-bottom:1px solid #fee4e2">${esc(x)}</div>`).join('')}<p class="muted">No data was changed.</p></div>`;return}
  // Commit. Match customer/supplier names to IDs.
  const custMap=n=>tmp.customers.find(c=>c.name.toLowerCase()===n.toLowerCase());
  const supMap=n=>tmp.suppliers.find(c=>c.name.toLowerCase()===n.toLowerCase());
  parsed.purchases.forEach(x=>{x.supplierId=supMap(x.supplierName)?.id||'';delete x.supplierName});
  parsed.sales.forEach(x=>{x.customerId=custMap(x.customerName)?.id||'';delete x.customerName});
  db=tmp;
  db.purchases.push(...parsed.purchases);
  db.sales.push(...parsed.sales);
  db.expenses.push(...parsed.expenses);
  recalculateStock();
  save();
  out.innerHTML=`<div class="card" style="border-color:#6ce9a6"><h3 style="color:#027a48;margin-top:0">✅ Import successful</h3><div class="grid"><div><b>${parsed.products.length}</b><br><span class="muted">Product rows</span></div><div><b>${parsed.customers.length}</b><br><span class="muted">Customers</span></div><div><b>${parsed.purchases.length}</b><br><span class="muted">Purchases</span></div><div><b>${parsed.sales.length}</b><br><span class="muted">Sales</span></div></div><p class="muted">Stock, sales, purchases and expenses have been updated.</p></div>`;
  alert('Excel import completed successfully.');
  render();
 };
 reader.readAsArrayBuffer(file);
}

function saveSettings(){const np=document.getElementById('resetPasswordNew').value;const cp=document.getElementById('resetPasswordConfirm').value;if(np||cp){if(np!==cp)return alert('Reset passwords do not match. Settings not saved.');if(np.length<4)return alert('Reset password must be at least 4 characters.');db.settings.resetPassword=np;}db.settings.business=document.getElementById('setBusiness').value;db.settings.phone=document.getElementById('setPhone').value;db.settings.gstin=document.getElementById('setGstin').value;db.settings.invoicePrefix=document.getElementById('setPrefix').value;db.settings.address=document.getElementById('setAddress').value;db.settings.cloudBackupEnabled=document.getElementById('cloudBackupToggle').checked;save();alert('Settings saved');render()}
function backup(filename='lacehisab-backup.json'){let payload={backupType:'LaceHisab Full Backup',version:1,createdAt:new Date().toISOString(),salesData:db,millData:millDB};dlBlob(JSON.stringify(payload,null,2),filename)}
const DAILY_BACKUP_MARKER='lacehisab_daily_backup_date_v1';
function dailyBackupOnOpen(){const now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');if(localStorage.getItem(DAILY_BACKUP_MARKER)===today)return;const filename=(db.settings.cloudBackupEnabled?'LaceHisab_CloudBackup_':'LaceHisab_DailyBackup_')+today+'.json';backup(filename);localStorage.setItem(DAILY_BACKUP_MARKER,today);console.log('LaceHisab daily backup download triggered for',today)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let parsed=JSON.parse(r.result);if(parsed&&parsed.backupType==='LaceHisab Full Backup'){if(!parsed.salesData||!parsed.millData)throw new Error('Incomplete backup');db=parsed.salesData;millDB=parsed.millData;save();millSave();render();alert('Full LaceHisab backup restored (Sales + Mill).')}else{db=parsed;save();render();alert('Sales-only backup restored. Mill data was not changed.')}}catch{alert('Invalid or incomplete backup. No data restored.')}};r.readAsText(f)}
function resetData(){if(!db.settings.resetPassword){alert('Please set a Reset Password in Settings first. Reset has been cancelled.');return;}const now=new Date();const stamp=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-')+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');backup('LaceHisab_Backup_'+stamp+'.json');if(!confirm('Automatic backup download has been started. Please verify the backup file is saved. Click OK only after checking the downloaded backup. Reset will not continue if you cancel.'))return;const entered=prompt('Enter your Reset Password to authorize data deletion:');if(entered===null)return;if(entered!==db.settings.resetPassword){alert('Incorrect password. Reset cancelled; no data has been deleted.');return;}if(!confirm('FINAL WARNING: This will permanently delete all LaceHisab business data from this browser. Continue?'))return;resetOnlineThenReload()}
function exportCSV(type){let rows=type==='sales'?db.sales:db.purchases;if(!rows.length)return alert('No data');let keys=Object.keys(rows[0]);let csv=[keys.join(','),...rows.map(r=>keys.map(k=>`"${String(r[k]??'').replaceAll('"','""')}"`).join(','))].join('\n');dlBlob(csv,type+'.csv')}
// --- Isolated Mill Section: uses its own localStorage key and never reads/writes main LaceHisab data ---
const MILL_KEY='lacehisab_mill_v1';
let millDB=JSON.parse(localStorage.getItem(MILL_KEY)||'null')||{designs:[],challans:[],receipts:[]};
function millSave(){localStorage.setItem(MILL_KEY,JSON.stringify(millDB));try{syncPush('mill')}catch(e){}}
const MILL_SENDER_ADDRESS='149-150, SHIV CITY INDUSTRIES-3, MAKNA, SURAT';const MILL_SENDER_PHONE='9913715177, 7048717289';function millFmtDate(v){if(!v)return '';let m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:v;}function millIsoDate(v){let m=String(v||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:v;}
function showMill(){current='mill';document.getElementById('pageTitle').textContent='Mill Section';nav();renderMill();}

function millTab(t){window.millTabName=t;let el=document.getElementById('millContent');if(!el)return; if(t==='dashboard'){let open=millDB.challans.filter(c=>millPending(c)>0).length;el.innerHTML=`<div class="grid"><div class="card stat"><div class="label">Total Challans</div><div class="value">${millDB.challans.length}</div></div><div class="card stat"><div class="label">Open / Partial</div><div class="value">${open}</div></div><div class="card stat"><div class="label">Designs</div><div class="value">${millDB.designs.length}</div></div><div class="card stat"><div class="label">Receipt Entries</div><div class="value">${millDB.receipts.length}</div></div></div><div class="card section"><h3>Mill Section is separate</h3><p class="muted">Mill data is saved under a separate browser storage key and does not connect to main LaceHisab stock, bills, purchases or parties.</p><p><b>Challan Brand:</b> OM CREATION</p></div>`;}
else if(t==='designs'){el.innerHTML=`<div class="card"><h3>${window.editMillDesign?'Edit Design':'Add Design Master'}</h3><div class="row"><div class="field"><label>Design / SKU</label><input id="mdSku" value="${esc(window.editMillDesign?.sku||'')}" placeholder="Design name / SKU"></div><div class="field"><label>Lines per TP</label><input id="mdLines" type="number" min="1" value="${window.editMillDesign?.linesPerTP||''}"></div><div class="field"><label>Final product cost per lace piece (₹)</label><input id="mdCost" type="number" min="0" step="0.01" value="${window.editMillDesign?.finalCost||''}"></div><button class="btn primary" onclick="saveMillDesign()">Save Design</button>${window.editMillDesign?`<button class="btn ghost" onclick="window.editMillDesign=null;millTab('designs')">Cancel Edit</button>`:''}</div></div><div class="card section"><h3>Design Masters</h3><div class="tablewrap"><table class="table"><thead><tr><th>Design</th><th>Lines / TP</th><th>Final Cost / Piece</th><th>Actions</th></tr></thead><tbody>${millDB.designs.map(d=>`<tr><td>${esc(d.sku)}</td><td>${d.linesPerTP}</td><td>${money(d.finalCost)}</td><td><button class="btn ghost" onclick="editMillDesign('${d.id}')">Edit</button> <button class="btn danger" onclick="deleteMillDesign('${d.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No designs added</td></tr>'}</tbody></table></div></div>`;}
else if(t==='challans'){el.innerHTML=`<div class="card"><h3>${window.editMillChallan?'Edit Challan':'Create Delivery Challan'}</h3><div class="row"><div class="field"><label>Challan Date (DD/MM/YYYY)</label><input id="mcDate" type="date" value="${window.editMillChallan?.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Mill / Party Name</label><input id="mcMill" value="${esc(window.editMillChallan?.mill||'')}"></div><div class="field"><label>Party Address</label><input id="mcPartyAddress" value="${esc(window.editMillChallan?.partyAddress||'')}"></div><div class="field"><label>Party GSTIN</label><input id="mcPartyGSTIN" value="${esc(window.editMillChallan?.partyGSTIN||'')}"></div><div class="field"><label>Colour (common to challan)</label><input id="mcColour" value="${esc(window.editMillChallan?.colour||'')}"></div></div><div class="row section"><div class="field"><label>OM CREATION Address (print header)</label><input id="mcSenderAddress" value="${esc(window.editMillChallan?.senderAddress||MILL_SENDER_ADDRESS)}"></div><div class="field"><label>OM CREATION Phone (print header)</label><input id="mcSenderPhone" value="${esc(window.editMillChallan?.senderPhone||MILL_SENDER_PHONE)}"></div></div><div class="row section"><div class="field"><label>Design</label><select id="mcDesign"><option value="">Select design</option>${millDB.designs.map(d=>`<option value="${d.id}">${esc(d.sku)}</option>`).join('')}</select></div><div class="field"><label>Qty (TP)</label><input id="mcQty" type="number" min="1"></div><div class="field"><label>Rate (₹ / TP)</label><input id="mcRate" type="number" min="0" step="0.01"></div><button class="btn ghost" onclick="addMillChallanItem()">Add Item</button></div><div class="tablewrap section"><table class="table"><thead><tr><th>Sr.</th><th>Design</th><th>Qty</th><th>Rate</th><th>Amount</th><th></th></tr></thead><tbody id="mcItems"></tbody></table></div><div class="row section"><div class="field"><label>Remarks</label><input id="mcRemarks" value="${esc(window.editMillChallan?.remarks||'')}"></div><button class="btn primary" onclick="saveMillChallan()">${window.editMillChallan?'Update Challan':'Save Challan'}</button>${window.editMillChallan?`<button class="btn ghost" onclick="window.editMillChallan=null;millTab('challans')">Cancel</button>`:''}</div></div><div class="card section"><h3>Challan Register</h3><div class="tablewrap"><table class="table"><thead><tr><th>Challan No.</th><th>Date</th><th>Mill</th><th>Colour</th><th>TP Qty</th><th>Expected Lines</th><th>Received Lines</th><th>Pending Lines</th><th>Actions</th></tr></thead><tbody>${millDB.challans.slice().reverse().map(c=>`<tr><td>${esc(c.no)}</td><td>${millFmtDate(c.date)}</td><td>${esc(c.mill)}</td><td>${esc(c.colour)}</td><td>${millQty(c)}</td><td>${millExpected(c)}</td><td>${millReceived(c)}</td><td>${millPending(c)}</td><td><button class="btn ghost" onclick="printMillChallan('${c.id}')">Print</button> <button class="btn ghost" onclick="editMillChallan('${c.id}')">Edit</button> <button class="btn danger" onclick="deleteMillChallan('${c.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No challans created</td></tr>'}</tbody></table></div></div>`;renderMillItems();if(window.editMillChallan){document.getElementById('mcDesign').value='';}}
else if(t==='receipts'){el.innerHTML=`<div class="card"><h3>Add Lace Receive Entry</h3><div class="row"><div class="field"><label>Challan</label><select id="mrChallan"><option value="">Select challan</option>${millDB.challans.map(c=>`<option value="${c.id}">${esc(c.no)} — ${esc(c.mill)} — ${esc(c.colour)}</option>`).join('')}</select></div><div class="field"><label>Receive Date (DD/MM/YYYY)</label><input id="mrDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Design</label><select id="mrItem"><option value="">Select design</option></select></div><div class="field"><label>Good lace lines received</label><input id="mrQty" type="number" min="1"></div><div class="field"><label>Note</label><input id="mrNote"></div><button class="btn primary" onclick="saveMillReceipt()">Save Receive</button></div><div class="section muted">Every receive entry is saved separately with date and quantity. Entries can be edited or deleted; other entries remain unchanged.</div></div><div class="card section"><h3>Receive History</h3><div class="tablewrap"><table class="table"><thead><tr><th>Receipt ID</th><th>Date</th><th>Challan</th><th>Design</th><th>Good Lines</th><th>Note</th><th>Actions</th></tr></thead><tbody>${millDB.receipts.slice().reverse().map(r=>{let c=millDB.challans.find(x=>x.id===r.challanId);let item=c?.items.find(i=>i.id===r.itemId);return `<tr><td>${esc(r.no)}</td><td>${millFmtDate(r.date)}</td><td>${esc(c?.no||'Deleted challan')}</td><td>${esc(item?.sku||r.skuSnapshot||'')}</td><td>${r.qty}</td><td>${esc(r.note||'')}</td><td><button class="btn ghost" onclick="editMillReceipt('${r.id}')">Edit</button> <button class="btn danger" onclick="deleteMillReceipt('${r.id}')">Delete</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No receive entries yet</td></tr>'}</tbody></table></div></div>`;document.getElementById('mrChallan').addEventListener('change',millPopulateReceiveItems);millPopulateReceiveItems();}
else {let rows=[];millDB.challans.forEach(c=>c.items.forEach(i=>{let expected=i.qty*(millDB.designs.find(d=>d.id===i.designId)?.linesPerTP||0);let received=millItemReceived(c.id,i.id);let missing=Math.max(0,expected-received);let cost=(millDB.designs.find(d=>d.id===i.designId)?.finalCost||0);rows.push({challan:c.no,design:i.sku,color:c.colour,expected,received,missing,pct:expected?missing/expected*100:0,loss:missing*cost});}));el.innerHTML=`<div class="card"><h3>Loss Reconciliation — Batch / Design / Colour</h3><div class="tablewrap"><table class="table"><thead><tr><th>Challan</th><th>Design</th><th>Colour</th><th>Expected Lines</th><th>Good Received</th><th>Missing</th><th>Loss %</th><th>Loss Value</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.challan)}</td><td>${esc(r.design)}</td><td>${esc(r.color)}</td><td>${r.expected}</td><td>${r.received}</td><td>${r.missing}</td><td>${r.pct.toFixed(2)}%</td><td>${money(r.loss)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No batches to report</td></tr>'}</tbody></table></div><h3>Combined Totals</h3><p><b>Expected:</b> ${rows.reduce((a,r)=>a+r.expected,0)} &nbsp; <b>Received:</b> ${rows.reduce((a,r)=>a+r.received,0)} &nbsp; <b>Missing:</b> ${rows.reduce((a,r)=>a+r.missing,0)} &nbsp; <b>Loss value:</b> ${money(rows.reduce((a,r)=>a+r.loss,0))}</p><button class="btn ghost" onclick="exportMillLossCSV()">Export Loss Report CSV</button></div>`;}}
function millQty(c){return c.items.reduce((a,i)=>a+(Number(i.qty)||0),0)}
function millExpected(c){return c.items.reduce((a,i)=>a+(Number(i.qty)||0)*(millDB.designs.find(d=>d.id===i.designId)?.linesPerTP||0),0)}
function millItemReceived(cid,iid){return millDB.receipts.filter(r=>r.challanId===cid&&r.itemId===iid).reduce((a,r)=>a+(Number(r.qty)||0),0)}
function millReceived(c){return c.items.reduce((a,i)=>a+millItemReceived(c.id,i.id),0)}
function millPending(c){return Math.max(0,millExpected(c)-millReceived(c))}
function renderMillItems(){let b=document.getElementById('mcItems');if(!b)return;let items=window.millChallanDraft||(window.editMillChallan?.items||[]);b.innerHTML=items.map((i,n)=>`<tr><td>${n+1}</td><td>${esc(i.sku)}</td><td>${i.qty}</td><td>${money(i.rate)}</td><td>${money(i.qty*i.rate)}</td><td><button class="btn danger" onclick="removeMillItem(${n})">Remove</button></td></tr>`).join('');}
function addMillChallanItem(){let did=document.getElementById('mcDesign').value,q=Number(document.getElementById('mcQty').value),r=Number(document.getElementById('mcRate').value),d=millDB.designs.find(x=>x.id===did);if(!d||q<=0||r<0)return alert('Select design and enter valid quantity/rate');let draft=window.millChallanDraft||(window.editMillChallan?.items||[]);draft.push({id:id(),designId:d.id,sku:d.sku,qty:q,rate:r});window.millChallanDraft=draft;document.getElementById('mcQty').value='';document.getElementById('mcRate').value='';renderMillItems();}
function removeMillItem(n){let draft=window.millChallanDraft||(window.editMillChallan?.items||[]);let item=draft[n];if(!item||!confirm(`Remove ${item.sku} from this challan draft? This change will apply when you save the challan.`))return;draft.splice(n,1);window.millChallanDraft=draft;renderMillItems();}
function saveMillChallan(){let items=window.millChallanDraft||(window.editMillChallan?.items||[]);if(!items.length)return alert('Add at least one design line');let data={date:document.getElementById('mcDate').value,mill:document.getElementById('mcMill').value.trim(),partyAddress:document.getElementById('mcPartyAddress').value.trim(),partyGSTIN:document.getElementById('mcPartyGSTIN').value.trim(),senderAddress:document.getElementById('mcSenderAddress').value.trim(),senderPhone:document.getElementById('mcSenderPhone').value.trim(),colour:document.getElementById('mcColour').value.trim(),remarks:document.getElementById('mcRemarks').value.trim(),items:items};if(window.editMillChallan){if(!confirm(`Confirm update to challan ${window.editMillChallan.no}? This overwrites the saved challan details.`))return;Object.assign(window.editMillChallan,data);window.editMillChallan=null;}else{let n=1+millDB.challans.reduce((a,c)=>Math.max(a,Number((c.no||'').replace(/\\D/g,''))||0),0);millDB.challans.push({id:id(),no:'DC-'+String(n).padStart(5,'0'),...data});}window.millChallanDraft=null;millSave();millTab('challans');}
function editMillChallan(cid){let c=millDB.challans.find(x=>x.id===cid);if(!c)return;if(!confirm(`Edit challan ${c.no}? You can review changes before saving. Nothing will be changed until you confirm Update Challan.`))return;window.editMillChallan=c;window.millChallanDraft=c.items.map(i=>({...i}));millTab('challans');}
function deleteMillChallan(cid){let c=millDB.challans.find(x=>x.id===cid);if(!c||!confirm(`WARNING: Delete challan ${c.no}? All linked receive entries will also be deleted. This cannot be undone. Continue?`))return;millDB.receipts=millDB.receipts.filter(r=>r.challanId!==cid);millDB.challans=millDB.challans.filter(x=>x.id!==cid);millSave();millTab('challans');}
function saveMillDesign(){let sku=document.getElementById('mdSku').value.trim(),lines=Number(document.getElementById('mdLines').value),cost=Number(document.getElementById('mdCost').value);if(!sku||lines<=0||cost<0)return alert('Enter design, lines per TP, and final cost');if(window.editMillDesign){if(!confirm(`Save changes to design ${window.editMillDesign.sku}? This will update the existing design master.`))return;Object.assign(window.editMillDesign,{sku,linesPerTP:lines,finalCost:cost});window.editMillDesign=null;}else millDB.designs.push({id:id(),sku,linesPerTP:lines,finalCost:cost});millSave();millTab('designs');}
function editMillDesign(did){let d=millDB.designs.find(x=>x.id===did);if(!d)return;if(!confirm(`Edit design ${d.sku}? You can review changes before saving.`))return;window.editMillDesign=d;millTab('designs');}
function deleteMillDesign(did){let d=millDB.designs.find(x=>x.id===did);if(!d||!confirm(`WARNING: Delete design ${d.sku}? This cannot be undone. Continue?`))return;if(millDB.challans.some(c=>c.items.some(i=>i.designId===did)))return alert('Design is used in a challan and cannot be deleted.');millDB.designs=millDB.designs.filter(x=>x.id!==did);millSave();millTab('designs');}
function millPopulateReceiveItems(){let c=millDB.challans.find(x=>x.id===document.getElementById('mrChallan')?.value),s=document.getElementById('mrItem');if(!s)return;s.innerHTML='<option value="">Select design</option>'+(c?.items||[]).map(i=>`<option value="${i.id}">${esc(i.sku)} (pending ${Math.max(0,i.qty*(millDB.designs.find(d=>d.id===i.designId)?.linesPerTP||0)-millItemReceived(c.id,i.id))})</option>`).join('');}
function saveMillReceipt(){let cid=document.getElementById('mrChallan').value,iid=document.getElementById('mrItem').value,q=Number(document.getElementById('mrQty').value),c=millDB.challans.find(x=>x.id===cid),i=c?.items.find(x=>x.id===iid);if(!c||!i||q<=0)return alert('Select challan/design and enter receive quantity');let pending=Math.max(0,i.qty*(millDB.designs.find(d=>d.id===i.designId)?.linesPerTP||0)-millItemReceived(cid,iid));if(q>pending&&!confirm(`Receive quantity ${q} is greater than pending ${pending}. Continue?`))return;millDB.receipts.push({id:id(),no:'RR-'+String(1+millDB.receipts.length).padStart(5,'0'),challanId:cid,itemId:iid,date:document.getElementById('mrDate').value,qty:q,note:document.getElementById('mrNote').value.trim(),skuSnapshot:i.sku});millSave();millTab('receipts');}
function editMillReceipt(rid){let r=millDB.receipts.find(x=>x.id===rid);if(!r)return;if(!confirm(`Edit receipt ${r.no} (${r.qty} lines)? Changes affect this saved receipt record only.`))return;let date=prompt('Receipt date (DD/MM/YYYY):',millFmtDate(r.date));if(date===null)return;date=millIsoDate(date);let qty=prompt('Good lace lines received:',r.qty);if(qty===null)return;let note=prompt('Note:',r.note||'');if(note===null)return;let n=Number(qty);if(!date||n<=0)return alert('Invalid date or quantity');r.date=date;r.qty=n;r.note=note;millSave();millTab('receipts');}
function deleteMillReceipt(rid){let r=millDB.receipts.find(x=>x.id===rid);if(!r||!confirm(`WARNING: Delete receipt ${r.no} (${r.qty} lines)? This cannot be undone. Continue?`))return;millDB.receipts=millDB.receipts.filter(x=>x.id!==rid);millSave();millTab('receipts');}

 let c=millDB.challans.find(x=>x.id===cid);if(!c)return;
 let totalQ=millQty(c),totalA=c.items.reduce((a,i)=>a+i*i.rate,0);

 };

function exportMillLossCSV(){let out=['Challan,Design,Colour,Expected Lines,Received,Missing,Loss %,Loss Value'];millDB.challans.forEach(c=>c.items.forEach(i=>{let d=millDB.designs.find(x=>x.id===i.designId),exp=i.qty*(d?.linesPerTP||0),rec=millItemReceived(c.id,i.id),miss=Math.max(0,exp-rec),cost=d?.finalCost||0;out.push([c.no,i.sku,c.colour,exp,rec,miss,exp?miss/exp*100:0,miss*cost].map(x=>`"${String(x).replaceAll('"','""')}"`).join(','));}));dlBlob(out.join('\n'),'mill-loss-report.csv');}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== Supabase layer: login + cross-device sync ===== */
const SUPABASE_URL=(window.LH_CONFIG&&window.LH_CONFIG.url)||'PASTE_YOUR_PROJECT_URL_HERE';
const SUPABASE_ANON_KEY=(window.LH_CONFIG&&window.LH_CONFIG.key)||'PASTE_YOUR_ANON_PUBLIC_KEY_HERE';

function toast(msg){let t=document.getElementById('syncToast');if(!t){t=document.createElement('div');t.id='syncToast';t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:8px 14px;border-radius:8px;font:13px Arial,sans-serif;z-index:99999;opacity:0;transition:opacity .2s;pointer-events:none';document.body.appendChild(t)}t.textContent=msg;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,2200)}
function dlLocal(name,data){const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function dlBlob(text,name){dlLocal(name,text)}
function dlXlsx(wb,name){try{const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});dlLocal(name,new Blob([buf]))}catch(e){alert('Could not build Excel file')}}

const SYNC={sb:null,user:null,ok:false,timers:{},busy:{}};
function lget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const SRC={main:()=>({key:KEY,obj:db}),mill:()=>({key:MILL_KEY,obj:millDB})};
function tsKey(w){return 'lh_ts_'+(SYNC.user?SYNC.user.id:'x')+'_'+w}

function syncPush(which){if(!SYNC.ok)return;clearTimeout(SYNC.timers[which]);SYNC.timers[which]=setTimeout(()=>syncWrite(which),600)}
async function syncWrite(which){
  if(SYNC.busy[which]){SYNC.timers[which]=setTimeout(()=>syncWrite(which),800);return}
  SYNC.busy[which]=true;
  try{
    const ts=Date.now();
    const {error}=await SYNC.sb.from('app_data').upsert({user_id:SYNC.user.id,key:which,value:SRC[which]().obj,updated_at:new Date(ts).toISOString()},{onConflict:'user_id,key'});
    if(error)throw error;
    lset(tsKey(which),String(ts));toast('Saved online ✓');
  }catch(e){console.error(e);toast('Online save failed: '+((e&&e.message)||'unknown error').slice(0,90))}
  SYNC.busy[which]=false;
}
async function syncPullOne(which){
  const {data,error}=await SYNC.sb.from('app_data').select('value,updated_at').eq('user_id',SYNC.user.id).eq('key',which).maybeSingle();
  if(error)throw error;
  const localTs=Number(lget(tsKey(which))||0);
  if(!data){ if(lget(SRC[which]().key))await syncWrite(which); return false }
  const remoteTs=Date.parse(data.updated_at);
  if(remoteTs<=localTs)return false;
  lset(SRC[which]().key,JSON.stringify(data.value));lset(tsKey(which),String(remoteTs));
  return true;
}
async function pullAll(){const a=await syncPullOne('main'),b=await syncPullOne('mill');return a||b}


async function resetOnlineThenReload(){
  if(!SYNC.ok){alert('Not connected online, so reset was cancelled. Nothing was deleted.');return}
  try{
    for(const w of ['main','mill']){const {error}=await SYNC.sb.from('app_data').delete().eq('user_id',SYNC.user.id).eq('key',w);if(error)throw error}
    try{localStorage.removeItem(KEY);localStorage.removeItem(MILL_KEY);['main','mill'].forEach(w=>localStorage.removeItem(tsKey(w)))}catch(e){}
    location.reload();
  }catch(e){alert('Could not delete the online data: '+((e&&e.message)||e)+'. Nothing was deleted.')}
}
function showLogin(msg){
  let o=document.getElementById('loginBox');
  if(!o){o=document.createElement('div');o.id='loginBox';o.style.cssText='position:fixed;inset:0;background:#f3f4f6;z-index:100000;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;padding:16px';
  o.innerHTML='<div style="background:#fff;border-radius:12px;padding:24px;width:100%;max-width:340px;box-shadow:0 4px 24px rgba(0,0,0,.12)"><h2 style="margin:0 0 4px">LaceHisab</h2><div style="color:#666;font-size:13px;margin-bottom:14px">Sign in to open your business data</div><input id="lgEmail" type="email" placeholder="Email" autocomplete="username" style="width:100%;padding:10px;margin-bottom:8px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box"><input id="lgPass" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box"><button id="lgIn" style="width:100%;padding:10px;border:0;border-radius:8px;background:#111;color:#fff;font-size:15px;cursor:pointer">Sign in</button><button id="lgUp" style="width:100%;padding:8px;margin-top:8px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer">Create account (first time only)</button><div id="lgMsg" style="color:#b00;font-size:13px;margin-top:10px;min-height:16px"></div></div>';
  document.body.appendChild(o);
  const go=async(up)=>{const email=lgEmail.value.trim(),password=lgPass.value;if(!email||!password){lgMsg.textContent='Enter email and password';return}lgMsg.style.color='#555';lgMsg.textContent='Please wait…';
    const r=up?await SYNC.sb.auth.signUp({email,password}):await SYNC.sb.auth.signInWithPassword({email,password});
    if(r.error){lgMsg.style.color='#b00';lgMsg.textContent=r.error.message;return}
    if(up&&!r.data.session){lgMsg.style.color='#080';lgMsg.textContent='Account created. Check your email to confirm, then sign in.';return}
    afterLogin(r.data.session)};
  lgIn.onclick=()=>go(false);lgUp.onclick=()=>go(true);lgPass.onkeydown=e=>{if(e.key==='Enter')go(false)}}
  o.style.display='flex';if(msg){document.getElementById('lgMsg').textContent=msg}
}
async function afterLogin(session){
  SYNC.user=session.user;
  const o=document.getElementById('loginBox');if(o)o.style.display='none';
  try{const changed=await pullAll();SYNC.ok=true;
    if(changed){let once=false;try{once=sessionStorage.getItem('lh_reloaded')==='1'}catch(e){}
      if(!once){try{sessionStorage.setItem('lh_reloaded','1')}catch(e){}location.reload();return}}
    try{sessionStorage.removeItem('lh_reloaded')}catch(e){}try{dailyBackupOnOpen()}catch(e){}
  }catch(e){console.error(e);const m=(e&&(e.message||e.error_description||e.details))||String(e);const bar=document.createElement('div');bar.style.cssText='position:fixed;left:0;right:0;top:0;background:#fee;color:#900;padding:10px 14px;font:13px Arial,sans-serif;z-index:100001;border-bottom:1px solid #c99';bar.innerHTML='<b>Could not reach online storage — working on this device only.</b><br>Reason: '+String(m).replace(/</g,'&lt;')+' <button style="float:right" onclick="this.parentNode.remove()">Close</button>';document.body.appendChild(bar)}
  if(!document.getElementById('lhOut')){const b=document.createElement('button');b.id='lhOut';b.textContent='Sign out';b.style.cssText='position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:9999;font-size:11px;padding:4px 8px;border:1px solid #bbb;border-radius:6px;background:#fff;opacity:.75;cursor:pointer';b.onclick=async()=>{await SYNC.sb.auth.signOut();location.reload()};document.body.appendChild(b)}if(!document.getElementById('lhOut2')){const side=document.querySelector('.side');if(side){const c=document.createElement('button');c.id='lhOut2';c.className='btn';c.textContent='Sign out';c.onclick=async()=>{await SYNC.sb.auth.signOut();location.reload()};side.appendChild(c)}}
}
(async function init(){
  if(SUPABASE_URL.startsWith('PASTE')){document.body.insertAdjacentHTML('afterbegin','<div style="background:#fee;color:#900;padding:8px;font:13px Arial">Supabase is not configured yet. Edit SUPABASE_URL and SUPABASE_ANON_KEY at the bottom of this file.</div>');return}
  if(!window.supabase){
    const urls=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js','https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'];
    for(const u of urls){if(window.supabase)break;await new Promise(r=>{const x=document.createElement('script');x.src=u;x.onload=r;x.onerror=r;document.head.appendChild(x)})}
  }
  if(!window.supabase){showLogin('Could not load login library from any source. An ad-blocker, antivirus or network may be blocking cdn.jsdelivr.net / unpkg.com. Try another browser or turn off the blocker for this page.');return}
  SYNC.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const {data}=await SYNC.sb.auth.getSession();
  if(data.session)afterLogin(data.session);else showLogin();
})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SYNC.ok&&!document.querySelector('input:focus,textarea:focus,select:focus')){pullAll().then(c=>{if(c)location.reload()}).catch(()=>{})}});
</script>

<script>
(function(){
  function setup(){
    var top=document.querySelector('.top');
    if(top&&!document.getElementById('navToggle')){
      var b=document.createElement('button');b.id='navToggle';b.type='button';b.setAttribute('aria-label','Menu');b.textContent='☰';
      b.onclick=function(e){e.stopPropagation();document.body.classList.toggle('navopen')};
      top.insertBefore(b,top.firstChild);
    }
    var nav=document.getElementById('nav');
    if(nav)nav.addEventListener('click',function(){document.body.classList.remove('navopen')});
    document.addEventListener('click',function(e){
      if(document.body.classList.contains('navopen')&&!e.target.closest('.side')&&e.target.id!=='navToggle'){document.body.classList.remove('navopen');e.preventDefault();e.stopPropagation()}
      else if(e.target.closest&&e.target.closest('.side')&&e.target.closest('button[onclick*="showMill"]')){document.body.classList.remove('navopen')}
    },true);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
